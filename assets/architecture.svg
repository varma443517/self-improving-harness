<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Self-improving harness: five data-engineering tasks plugged into Google Research's Harness² loop through a DataAdapter. Editors propose, the worker probes, a composer merges, a blind selector picks, a reflector saves lessons to a library. Answers are scored only after selection.</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E7EBF0" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C98510"/></marker>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .h { font-size: 21px; font-weight: 700; fill: #111827; }
      .s { font-size: 15.5px; fill: #4B5563; }
      .tag { font-size: 12.5px; letter-spacing: .08em; font-weight: 600; }
      .edge { stroke: #8A94A6; stroke-width: 2; fill: none; marker-end: url(#a); }
      .el { font-size: 13.5px; fill: #4B5563; }
      .elbg { fill: #F7F8FA; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#F7F8FA"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>

  <!-- header -->
  <circle cx="62" cy="76" r="9" fill="#0E8FA3"/>
  <text x="84" y="88" class="mono" font-size="36" font-weight="700" fill="#111827">Self-improving harness</text>
  <text x="56" y="128" font-size="20" fill="#374151">A coach model rewrites the files around a frozen worker, tests every edit</text>
  <text x="56" y="156" font-size="20" fill="#374151">by running it, and keeps evidence-backed lessons. Applied to data pipelines.</text>

  <!-- row 1: tasks -> adapter -> harness2 -->
  <g>
    <rect x="56" y="200" width="290" height="112" rx="12" fill="#DFF6E9" stroke="#1E9A5B" stroke-width="2.2"/>
    <path d="M76 218c0-4 6-7 13-7s13 3 13 7v16c0 4-6 7-13 7s-13-3-13-7z M76 218c0 4 6 7 13 7s13-3 13-7" fill="none" stroke="#1E9A5B" stroke-width="1.8"/>
    <text x="114" y="236" class="h mono">5 data tasks</text>
    <text x="76" y="266" class="s mono">join · dedupe · schema drift</text>
    <text x="76" y="290" class="s mono">nulls · time zones</text>

    <rect x="395" y="200" width="290" height="112" rx="12" fill="#E3EEFF" stroke="#2F6FEB" stroke-width="2.2"/>
    <path d="M415 216l-7 8 7 8 M429 216l7 8-7 8" fill="none" stroke="#2F6FEB" stroke-width="1.8"/>
    <text x="448" y="236" class="h mono">DataAdapter</text>
    <text x="415" y="266" class="s mono">my code: 12 methods,</text>
    <text x="415" y="290" class="s mono">5 jobs, one wall</text>

    <rect x="734" y="200" width="290" height="112" rx="12" fill="#F1F2F4" stroke="#6B7280" stroke-width="2.2" stroke-dasharray="6 4"/>
    <path d="M760 214h-8v20h20v-8 M764 214h8v8 M772 214l-10 10" fill="none" stroke="#6B7280" stroke-width="1.8"/>
    <text x="788" y="236" class="h mono">Harness²</text>
    <text x="754" y="266" class="s mono">Google Research,</text>
    <text x="754" y="290" class="s mono">pinned at 1cfe254</text>

    <path d="M346 256 H389" class="edge"/>
    <path d="M685 256 H728" class="edge"/>
  </g>

  <!-- inner loop -->
  <rect x="40" y="350" width="1000" height="430" rx="16" fill="none" stroke="#7C4DDB" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="58" y="338" width="186" height="24" fill="#F7F8FA"/>
  <text x="66" y="356" class="tag mono" fill="#7C4DDB">INNER LOOP · ONE TASK</text>

  <rect x="80" y="420" width="230" height="100" rx="12" fill="#EEF1F5" stroke="#64748B" stroke-width="2.2"/>
  <path d="M100 436h12l6 6v20h-18z" fill="none" stroke="#64748B" stroke-width="1.8"/>
  <text x="128" y="454" class="h mono">Base harness</text>
  <text x="100" y="484" class="s mono">prompt · memory</text>
  <text x="100" y="506" class="s mono">5 pipeline scripts</text>

  <rect x="400" y="392" width="280" height="76" rx="12" fill="#EFE9FD" stroke="#7C4DDB" stroke-width="2.2"/>
  <text x="420" y="424" class="h mono">INV editor</text>
  <text x="420" y="451" class="s mono">how the agent works</text>
  <rect x="400" y="480" width="280" height="76" rx="12" fill="#EFE9FD" stroke="#7C4DDB" stroke-width="2.2"/>
  <text x="420" y="512" class="h mono">DOM editor</text>
  <text x="420" y="539" class="s mono">what an expert knows</text>

  <rect x="770" y="420" width="240" height="100" rx="12" fill="#DDF3F7" stroke="#0E8FA3" stroke-width="2.2"/>
  <path d="M790 438l14 8-14 8z" fill="#0E8FA3"/>
  <text x="816" y="454" class="h mono">Probe</text>
  <text x="790" y="484" class="s mono">worker runs each</text>
  <text x="790" y="506" class="s mono">candidate's script</text>

  <rect x="770" y="640" width="240" height="100" rx="12" fill="#EFE9FD" stroke="#7C4DDB" stroke-width="2.2"/>
  <text x="790" y="674" class="h mono">Compose</text>
  <text x="790" y="704" class="s mono">merge the edits that</text>
  <text x="790" y="726" class="s mono">changed the output</text>

  <rect x="400" y="640" width="280" height="100" rx="12" fill="#EFE9FD" stroke="#7C4DDB" stroke-width="2.2"/>
  <g class="mono" font-size="13" font-weight="700" fill="#7C4DDB">
    <rect x="420" y="656" width="22" height="20" rx="4" fill="#E2D8FB"/><text x="426" y="671">A</text>
    <rect x="448" y="656" width="22" height="20" rx="4" fill="#E2D8FB"/><text x="454" y="671">B</text>
  </g>
  <text x="480" y="672" class="h mono">Blind select</text>
  <text x="420" y="704" class="s mono">no labels, no answer</text>
  <text x="420" y="726" class="s mono">key, one final</text>

  <rect x="80" y="640" width="230" height="100" rx="12" fill="#DFF6E9" stroke="#1E9A5B" stroke-width="2.2"/>
  <path d="M98 664l7 7 13-15" fill="none" stroke="#1E9A5B" stroke-width="2.4"/>
  <text x="128" y="674" class="h mono">output.csv</text>
  <text x="100" y="704" class="s mono">from the refined</text>
  <text x="100" y="726" class="s mono">harness</text>

  <path d="M310 470 H352 V430 H394" class="edge"/>
  <path d="M352 470 V518 H394" class="edge"/>
  <path d="M680 430 H725 V470 H764" class="edge"/>
  <path d="M680 518 H725 V470" fill="none" stroke="#8A94A6" stroke-width="2"/>
  <path d="M890 520 V634" class="edge"/>
  <rect x="898" y="562" width="104" height="22" rx="4" class="elbg"/><text x="904" y="578" class="el mono">transcripts</text>
  <path d="M770 690 H686" class="edge"/>
  <path d="M400 690 H316" class="edge"/>

  <!-- outer loop -->
  <rect x="40" y="820" width="1000" height="200" rx="16" fill="none" stroke="#C98510" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="58" y="808" width="214" height="24" fill="#F7F8FA"/>
  <text x="66" y="826" class="tag mono" fill="#C98510">OUTER LOOP · ACROSS TASKS</text>

  <rect x="400" y="872" width="280" height="100" rx="12" fill="#EFE9FD" stroke="#7C4DDB" stroke-width="2.2"/>
  <text x="420" y="906" class="h mono">Reflect</text>
  <text x="420" y="936" class="s mono">cue · lesson · evidence</text>
  <text x="420" y="958" class="s mono" fill="#D23B5C">no contrast → no lesson</text>

  <rect x="80" y="872" width="230" height="100" rx="12" fill="#FFF4D9" stroke="#C98510" stroke-width="2.2"/>
  <path d="M98 890h10c3 0 5 2 5 5v22c0-3-2-5-5-5H98z M128 890h-10c-3 0-5 2-5 5v22c0-3 2-5 5-5h10z" fill="none" stroke="#C98510" stroke-width="1.6"/>
  <text x="140" y="906" class="h mono">Library</text>
  <text x="100" y="936" class="s mono">per-domain lessons</text>
  <text x="100" y="958" class="s mono">read by next task</text>

  <rect x="770" y="872" width="240" height="100" rx="12" fill="#FDE8EB" stroke="#D23B5C" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M790 890v-4a8 8 0 0 1 16 0v4 M786 890h24v16h-24z" fill="none" stroke="#D23B5C" stroke-width="1.8"/>
  <text x="820" y="906" class="h mono">Answer files</text>
  <text x="790" y="936" class="s mono">behind the wall: read</text>
  <text x="790" y="958" class="s mono">only after selection</text>

  <path d="M540 740 V866" class="edge"/>
  <rect x="548" y="790" width="74" height="22" rx="4" class="elbg"/><text x="554" y="806" class="el mono">adopted</text>
  <path d="M400 922 H316" class="edge"/>
  <rect x="322" y="896" width="58" height="22" rx="4" class="elbg"/><text x="328" y="912" class="el mono">lesson</text>
  <path d="M80 922 H58 V590 H372 V530 H394" fill="none" stroke="#C98510" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#al)"/>
  <rect x="96" y="579" width="190" height="22" rx="4" class="elbg"/><text x="102" y="595" class="el mono" fill="#C98510" font-weight="700">read first, next task</text>

  <!-- results -->
  <text x="56" y="1080" class="tag mono" fill="#6B7280">RESULTS · OFFLINE, SCRIPTED COACH, k = 1</text>
  <line x1="56" y1="1094" x2="1024" y2="1094" stroke="#D5DBE3" stroke-width="1.5"/>
  <g class="mono">
    <text x="56" y="1160" font-size="56" font-weight="700" fill="#1E9A5B">5/5</text>
    <text x="56" y="1194" class="s">tasks wrong → right</text>
    <text x="300" y="1160" font-size="56" font-weight="700" fill="#C98510">5</text>
    <text x="300" y="1194" class="s">lessons saved</text>
    <text x="540" y="1160" font-size="56" font-weight="700" fill="#0E8FA3">4 + 3</text>
    <text x="540" y="1194" class="s">runs + editor sessions</text>
    <text x="540" y="1216" class="s">per task</text>
    <text x="800" y="1160" font-size="56" font-weight="700" fill="#D23B5C">1</text>
    <text x="800" y="1194" class="s">blind spot shown:</text>
    <text x="800" y="1216" class="s">no contrast, no lesson</text>
  </g>

  <!-- legend + footer -->
  <g class="mono" font-size="14" fill="#4B5563">
    <rect x="56" y="1262" width="16" height="16" rx="4" fill="#EFE9FD" stroke="#7C4DDB" stroke-width="2"/><text x="80" y="1275">coach</text>
    <rect x="156" y="1262" width="16" height="16" rx="4" fill="#DDF3F7" stroke="#0E8FA3" stroke-width="2"/><text x="180" y="1275">frozen worker</text>
    <rect x="318" y="1262" width="16" height="16" rx="4" fill="#EEF1F5" stroke="#64748B" stroke-width="2"/><text x="342" y="1275">files</text>
    <rect x="404" y="1262" width="16" height="16" rx="4" fill="#FFF4D9" stroke="#C98510" stroke-width="2"/><text x="428" y="1275">lessons</text>
    <rect x="506" y="1262" width="16" height="16" rx="4" fill="#FDE8EB" stroke="#D23B5C" stroke-width="2"/><text x="530" y="1275">answers</text>
  </g>
  <text x="56" y="1318" class="mono" font-size="15" fill="#6B7280">github.com/varma443517/self-improving-harness · built on google-research/harness2</text>
</svg>
